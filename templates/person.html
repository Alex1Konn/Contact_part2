<body>
    <h1>Анкета</h1>
    {% if result %}
        <div class="result">{{ result }}</div>
    {% endif %}

    <form method="post" novalidate>
         {% csrf_token %}

        <div class="field">
            {{ form.name.label_tag }}
            {{ form.name }}
            {% for error in form.name.errors %}
                <div class="error"> {{error}} </div>
            {% endfor %}
        </div>

        <div class="field">
            {{ form.age.label_tag }}
            {{ form.age }}
            {% for error in form.age.errors %}
            {% endfor %}
        </div>

        <button type="submit">Отправить</button>
    </form>
</body>
